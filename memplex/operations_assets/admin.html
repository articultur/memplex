<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Memplex 策展控制台</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#d7dae0; --dim:#8b90a0; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:20px; margin:0; }
  .controls { padding:12px 24px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .controls input, .controls select, .controls button { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:8px 12px; border-radius:6px; }
  .controls button { background:var(--accent); border:none; cursor:pointer; }
  .controls button:hover { opacity:.85; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); font-size:14px; }
  th { color:var(--dim); font-weight:600; }
  .tier { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .tier-team { background:#3d2a1a; color:#e8a04c; }
  .tier-domain { background:#123a2e; color:#5bd6a2; }
  .tier-personal { background:#1a2f4a; color:#6fa8ff; }
  .tier-none { background:#252833; color:#8b90a0; }
  .actions button { background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:4px; padding:3px 8px; margin-right:4px; cursor:pointer; }
  .actions button:hover { color:var(--text); border-color:var(--accent); }
  #detail { margin:12px 24px; padding:14px; background:var(--panel); border:1px solid var(--border); border-radius:8px; white-space:pre-wrap; font-size:14px; display:none; }
  #msg { margin:8px 24px; color:#e8a04c; font-size:14px; min-height:18px; }
</style>
</head>
<body>
<header><h1>Memplex 策展控制台</h1><span style="color:var(--dim);font-size:14px">记忆 → 知识分层 · 团队协作</span></header>
<div class="controls">
  <input id="q" placeholder="搜索记忆…">
  <select id="tier">
    <option value="">全部层级</option>
    <option value="team">team</option>
    <option value="domain">domain</option>
    <option value="personal">personal</option>
    <option value="none">未分层</option>
  </select>
  <button onclick="loadMemories()">刷新</button>
  <span style="margin-left:auto;color:var(--dim);font-size:14px" id="count"></span>
</div>
<div id="msg"></div>
<table id="memories"></table>
<div id="detail"></div>
<script>
let MEMORIES = [];
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || (j.error) || ("HTTP " + r.status));
  return j;
}
function tierBadge(t) {
  const cls = t ? ("tier-" + t) : "tier-none";
  return `<span class="tier ${cls}">${escapeHtml(t || "无")}</span>`;
}
async function loadMemories() {
  const q = document.getElementById("q").value;
  const tier = document.getElementById("tier").value;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (tier) params.set("tier", tier);
  try {
    const j = await api("/admin/api/memories?" + params);
    MEMORIES = j.memories || [];
    document.getElementById("count").textContent = MEMORIES.length + " 条记忆";
    render();
  } catch (e) { document.getElementById("msg").textContent = "加载失败: " + e.message; }
}
function render() {
  const t = document.getElementById("memories");
  t.innerHTML = `<tr><th>名称</th><th>类型</th><th>域</th><th>层级</th><th>更新</th><th>操作</th></tr>` +
    MEMORIES.map(m => `<tr>
      <td>${escapeHtml(m.name || m.id)}</td>
      <td>${escapeHtml(m.memory_type || "function")}</td>
      <td>${escapeHtml(m.domain || "")}</td>
      <td>${tierBadge(m.knowledge_tier)}</td>
      <td>${escapeHtml((m.updated_at || "").slice(0, 16))}</td>
      <td class="actions">
        <button onclick="promote('${m.id}','team')">team</button>
        <button onclick="promote('${m.id}','domain')">domain</button>
        <button onclick="showDetail('${m.id}')">详情</button>
      </td>
    </tr>`).join("");
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function promote(id, tier) {
  try {
    await api("/admin/api/promote", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ memory_id:id, tier }) });
    document.getElementById("msg").textContent = `已晋升 ${id} → ${tier}`;
    loadMemories();
  } catch (e) { document.getElementById("msg").textContent = "晋升失败: " + e.message; }
}
async function showDetail(id) {
  try {
    const j = await api("/admin/api/facts?memory_id=" + encodeURIComponent(id));
    const d = document.getElementById("detail");
    d.style.display = "block";
    d.textContent = JSON.stringify(j, null, 2);
  } catch (e) { document.getElementById("msg").textContent = "详情失败: " + e.message; }
}
loadMemories();
</script>
</body>
</html>
