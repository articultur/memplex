# Minimal Prometheus scrape configuration for a memplex deployment.
# memplex serves Prometheus-format metrics at GET /metrics on its HTTP API;
# adjust the target host/port to the deployment.  Alert rules live next to
# this file in memplex-alerts.yml (byte-identical to the packaged copy in
# memplex/operations_assets/, enforced by tests/test_operations_evidence.py).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - memplex-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

scrape_configs:
  - job_name: memplex
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8080
