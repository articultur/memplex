name: G008 Real Host Lifecycle

on:
  workflow_call:
    inputs:
      release-artifact-name:
        required: true
        type: string
      release-artifact-sha256:
        required: true
        type: string
    secrets:
      MEMPLEX_HOST_LIFECYCLE_HMAC_KEY:
        required: true
      MEMPLEX_G008_HERMES_SOURCE_ROOT:
        required: true
      MEMPLEX_G008_DEPLOYMENT_ID:
        required: true
      MEMPLEX_G008_SOURCE_SHA256:
        required: true
      MEMPLEX_G008_TARGET_IDENTITY_SHA256:
        required: true
  workflow_dispatch:
    inputs:
      release-artifact-name:
        required: true
        type: string
      release-artifact-sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-four-host-lifecycle:
    # This label is intentionally unique: a hosted macOS matrix test must
    # never satisfy the protected check for real installed host CLIs.
    name: g008-real-host-lifecycle
    runs-on: [self-hosted, macOS, memplex-g008-real-host]
    # Hard cap for the proof itself; a job queued on an offline runner does
    # not consume this budget.  If the runner is offline the job sits queued
    # and the release stalls: restore the runner, then re-run the failed job
    # (or the whole Release workflow — the PyPI/npm publish jobs are
    # digest-idempotent, so a rerun never double-publishes).
    timeout-minutes: 30
    environment: g008-real-host
    env:
      MEMPLEX_HOST_LIFECYCLE_HMAC_KEY: ${{ secrets.MEMPLEX_HOST_LIFECYCLE_HMAC_KEY }}
      MEMPLEX_G008_HERMES_SOURCE_ROOT: ${{ secrets.MEMPLEX_G008_HERMES_SOURCE_ROOT }}
      MEMPLEX_G008_DEPLOYMENT_ID: ${{ secrets.MEMPLEX_G008_DEPLOYMENT_ID }}
      MEMPLEX_G008_SOURCE_SHA256: ${{ secrets.MEMPLEX_G008_SOURCE_SHA256 }}
      MEMPLEX_G008_ARTIFACT_SHA256: ${{ inputs.release-artifact-sha256 }}
      MEMPLEX_G008_TARGET_IDENTITY_SHA256: ${{ secrets.MEMPLEX_G008_TARGET_IDENTITY_SHA256 }}
      MEMPLEX_HOST_LIFECYCLE_KEY_ID: g008-release-2026-08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-python's python-versions installer requires sudo and the
      # hosted-image /Users/runner layout, neither of which exists on this
      # self-hosted runner; uv manages the pinned CPython in user space.
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Provision the pinned CPython
        run: uv python install 3.13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.release-artifact-name }}
          path: ${{ runner.temp }}/g008-release-bundle
          merge-multiple: true
      - name: Fail closed unless the protected runner has every real-host prerequisite
        shell: bash
        run: |
          set -euo pipefail
          command -v codex
          command -v claude
          command -v openclaw
          command -v hermes
          test -n "${MEMPLEX_HOST_LIFECYCLE_HMAC_KEY:-}"
          test -n "${MEMPLEX_G008_HERMES_SOURCE_ROOT:-}"
          test -n "${MEMPLEX_G008_DEPLOYMENT_ID:-}"
          test -n "${MEMPLEX_G008_SOURCE_SHA256:-}"
          test -n "${MEMPLEX_G008_TARGET_IDENTITY_SHA256:-}"
          test -d "$MEMPLEX_G008_HERMES_SOURCE_ROOT"
          valid_sha256() {
            test "${#1}" -eq 64
            case "$1" in *[!0-9a-f]*) return 1 ;; esac
          }
          valid_sha256 "$MEMPLEX_HOST_LIFECYCLE_HMAC_KEY"
          valid_sha256 "$MEMPLEX_G008_SOURCE_SHA256"
          valid_sha256 "${{ inputs.release-artifact-sha256 }}"
          valid_sha256 "$MEMPLEX_G008_TARGET_IDENTITY_SHA256"
      - name: Install locked verifier test tooling
        run: uv sync --locked --extra dev
      - name: Verify the downloaded manifest and release payload bytes
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "g008-release-bundle"
          manifest_path = root / "release-manifest.json"
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit("release manifest is missing or unsafe")

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8"),
              object_pairs_hook=reject_duplicates,
          )
          if set(manifest) != {"schema_version", "version", "tag", "artifacts"}:
              raise SystemExit("release manifest shape is invalid")
          version = manifest["version"]
          if (
              manifest["schema_version"] != 1
              or not isinstance(version, str)
              or not version
              or manifest["tag"] != f"v{version}"
          ):
              raise SystemExit("release manifest identity is invalid")
          artifacts = manifest["artifacts"]
          if not isinstance(artifacts, list) or not artifacts:
              raise SystemExit("release manifest artifact list is invalid")
          names = []
          for item in artifacts:
              if not isinstance(item, dict) or set(item) != {"name", "sha256", "size"}:
                  raise SystemExit("release artifact record is invalid")
              name = item["name"]
              if not isinstance(name, str) or Path(name).name != name:
                  raise SystemExit("release artifact name is invalid")
              if (
                  not isinstance(item["sha256"], str)
                  or len(item["sha256"]) != 64
                  or any(character not in "0123456789abcdef" for character in item["sha256"])
                  or type(item["size"]) is not int
                  or item["size"] < 0
              ):
                  raise SystemExit("release artifact metadata is invalid")
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"release artifact is missing or unsafe: {name}")
              if path.stat().st_size != item["size"]:
                  raise SystemExit(f"release artifact size mismatch: {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"release artifact digest mismatch: {name}")
              names.append(name)
          if names != sorted(names) or len(names) != len(set(names)):
              raise SystemExit("release artifact names are not canonical")
          wheels = [name for name in names if name.endswith(".whl")]
          npm_packages = [name for name in names if name.endswith(".tgz")]
          if len(wheels) != 1 or len(npm_packages) != 1:
              raise SystemExit("release bundle requires exactly one wheel and npm package")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MEMPLEX_G008_WHEEL={root / wheels[0]}\n")
              output.write(f"MEMPLEX_G008_NPM_TGZ={root / npm_packages[0]}\n")
              output.write(f"MEMPLEX_G008_RELEASE_VERSION={version}\n")
          PY
      - name: Install the wheel into a fresh artifact environment
        shell: bash
        run: |
          set -euo pipefail
          artifact_venv="$RUNNER_TEMP/g008-artifact-venv"
          rm -rf "$artifact_venv"
          uv export --locked --extra dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/g008-locked-requirements.txt"
          uv venv "$artifact_venv"
          uv pip install --python "$artifact_venv/bin/python" --require-hashes \
            --requirements "$RUNNER_TEMP/g008-locked-requirements.txt"
          uv pip install --python "$artifact_venv/bin/python" --no-deps \
            --force-reinstall "$MEMPLEX_G008_WHEEL"
          printf 'MEMPLEX_G008_ARTIFACT_VENV=%s\n' "$artifact_venv" >> "$GITHUB_ENV"
          (
            cd "$RUNNER_TEMP"
            "$artifact_venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import memplex

          package = Path(memplex.__file__).resolve()
          venv = Path("g008-artifact-venv").resolve()
          if not package.is_relative_to(venv):
              raise SystemExit(f"memplex did not load from release wheel: {package}")
          if version("memplex") != os.environ["MEMPLEX_G008_RELEASE_VERSION"]:
              raise SystemExit("installed wheel version does not match release manifest")
          PY
          )
      - name: Install all hosts below one fresh isolated root
        shell: bash
        run: |
          set -euo pipefail
          isolated_root="$(mktemp -d "$RUNNER_TEMP/memplex-g008.XXXXXX")"
          chmod 700 "$isolated_root"
          printf 'MEMPLEX_G008_ISOLATED_ROOT=%s\n' "$isolated_root" >> "$GITHUB_ENV"
          mkdir -p "$isolated_root/workspace"
          "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent install --agent codex \
            --target-dir "$isolated_root/codex" --user-id g008-runner \
            --project-path "$isolated_root/workspace"
          "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent install --agent claude-code \
            --target-dir "$isolated_root/claude-code" --user-id g008-runner \
            --project-path "$isolated_root/workspace"
          "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent install --agent openclaw \
            --target-dir "$isolated_root/openclaw" --user-id g008-runner \
            --project-path "$isolated_root/workspace"
          "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent install --agent hermes \
            --target-dir "$isolated_root/hermes" --user-id g008-runner \
            --project-path "$isolated_root/workspace"
      - name: Check four host runtime sidecars before lifecycle proof
        shell: bash
        run: |
          set -euo pipefail
          check_host_status() {
            phase="$1"
            agent="$2"
            host_root="$MEMPLEX_G008_ISOLATED_ROOT/$agent"
            "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent status \
              --agent "$agent" --target-dir "$host_root" | \
              "$MEMPLEX_G008_ARTIFACT_VENV/bin/python" -c '
          import json
          import pathlib
          import sys

          agent, host_root, isolated_root, phase = sys.argv[1:]
          report = json.load(sys.stdin)
          installation_report = report.get("install_state") if isinstance(report, dict) else None
          installation = (
              installation_report.get("install_state")
              if isinstance(installation_report, dict)
              else None
          )
          runtime = (
              installation_report.get("runtime_status")
              if isinstance(installation_report, dict)
              else None
          )
          runtime_state = runtime.get("state") if isinstance(runtime, dict) else None
          resolved_host = pathlib.Path(host_root).resolve()
          resolved_isolated = pathlib.Path(isolated_root).resolve()
          if resolved_host.parent != resolved_isolated:
              raise SystemExit(f"{phase}: status root escaped G008 isolation")
          if (
              report.get("selected_host") != agent
              or not isinstance(installation_report, dict)
              or installation_report.get("status") != "healthy"
              or not isinstance(installation, dict)
              or not all(installation.get(key) is True for key in ("installed", "selected", "managed"))
              or runtime_state != "healthy"
          ):
              reason = runtime.get("reason") if isinstance(runtime, dict) else "missing_runtime_status"
              raise SystemExit(
                  f"{phase}: {agent} runtime sidecar is {runtime_state!r} ({reason!r}); "
                  "degraded/state_unreadable state blocks the lifecycle proof"
              )
          ' "$agent" "$host_root" "$MEMPLEX_G008_ISOLATED_ROOT" "$phase"
          }
          check_host_status before codex
          check_host_status before claude-code
          check_host_status before openclaw
          check_host_status before hermes
      - name: Diagnose host CLI version probes
        shell: bash
        run: |
          set +e
          echo "HOME=$HOME USER=$(whoami) CI=${CI:-}"
          echo "PATH=$PATH"
          for cli in codex claude openclaw hermes; do
            path="$(command -v "$cli")" || { echo "== $cli: NOT ON PATH"; continue; }
            out="$("$path" --version 2>&1)"; rc=$?
            echo "== $cli ($path) rc=$rc out=[$(echo "$out" | head -c 200)]"
          done
      - name: Verify the signed, deployment-bound four-host lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g008-evidence"
          "$MEMPLEX_G008_ARTIFACT_VENV/bin/python" scripts/verify_g008_host_lifecycle.py \
            --codex-cli "$(command -v codex)" \
            --claude-cli "$(command -v claude)" \
            --openclaw-cli "$(command -v openclaw)" \
            --hermes-cli "$(command -v hermes)" \
            --hermes-source-root "$MEMPLEX_G008_HERMES_SOURCE_ROOT" \
            --isolated-root "$MEMPLEX_G008_ISOLATED_ROOT" \
            --deployment-id "$MEMPLEX_G008_DEPLOYMENT_ID" \
            --source-sha256 "$MEMPLEX_G008_SOURCE_SHA256" \
            --artifact-sha256 "$MEMPLEX_G008_ARTIFACT_SHA256" \
            --target-identity-sha256 "$MEMPLEX_G008_TARGET_IDENTITY_SHA256" \
            --key-id "$MEMPLEX_HOST_LIFECYCLE_KEY_ID" \
            --evidence-output "$RUNNER_TEMP/g008-evidence/g008-host-lifecycle.json"
      - name: Check four host runtime sidecars after lifecycle proof
        shell: bash
        run: |
          set -euo pipefail
          check_host_status() {
            phase="$1"
            agent="$2"
            host_root="$MEMPLEX_G008_ISOLATED_ROOT/$agent"
            "$MEMPLEX_G008_ARTIFACT_VENV/bin/memplex" --output json agent status \
              --agent "$agent" --target-dir "$host_root" | \
              "$MEMPLEX_G008_ARTIFACT_VENV/bin/python" -c '
          import json
          import pathlib
          import sys

          agent, host_root, isolated_root, phase = sys.argv[1:]
          report = json.load(sys.stdin)
          installation_report = report.get("install_state") if isinstance(report, dict) else None
          installation = (
              installation_report.get("install_state")
              if isinstance(installation_report, dict)
              else None
          )
          runtime = (
              installation_report.get("runtime_status")
              if isinstance(installation_report, dict)
              else None
          )
          runtime_state = runtime.get("state") if isinstance(runtime, dict) else None
          resolved_host = pathlib.Path(host_root).resolve()
          resolved_isolated = pathlib.Path(isolated_root).resolve()
          if resolved_host.parent != resolved_isolated:
              raise SystemExit(f"{phase}: status root escaped G008 isolation")
          if (
              report.get("selected_host") != agent
              or not isinstance(installation_report, dict)
              or installation_report.get("status") != "healthy"
              or not isinstance(installation, dict)
              or not all(installation.get(key) is True for key in ("installed", "selected", "managed"))
              or runtime_state != "healthy"
          ):
              reason = runtime.get("reason") if isinstance(runtime, dict) else "missing_runtime_status"
              raise SystemExit(
                  f"{phase}: {agent} runtime sidecar is {runtime_state!r} ({reason!r}); "
                  "degraded/state_unreadable state blocks the lifecycle proof"
              )
          ' "$agent" "$host_root" "$MEMPLEX_G008_ISOLATED_ROOT" "$phase"
          }
          check_host_status after codex
          check_host_status after claude-code
          check_host_status after openclaw
          check_host_status after hermes
