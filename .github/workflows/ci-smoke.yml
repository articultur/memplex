name: CI Smoke

on:
  workflow_dispatch: {}
  push:
    branches: [chore/ruff-0.16-unpin]

jobs:
  gates-on-self-hosted:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Static gates (ruff / lint-imports / mypy)
        run: |
          uv sync --locked --extra dev
          .venv/bin/ruff check memplex tests benchmarks scripts
          .venv/bin/lint-imports
          .venv/bin/mypy
      - name: Focused suites
        run: |
          .venv/bin/python -m pytest tests/test_multi_path.py tests/test_config.py \
            tests/test_g003_benchmark_runner.py tests/test_capability_manifest.py -q
