# Temporary T13 diagnostic; publication itself may trigger this job.
name: T13 systemic deadline once

on:
  push:
    branches: [feat/source-validity-v1-a611-20261012]
    paths: [.github/workflows/t13-systemic-deadline-once.yml]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/source-validity-v1-a611-20261012' &&
      github.event.before == '6481d2957581304be3e046b15fba7be6d62d2873' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install test environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Lint (incl. C901 complexity freeze-gate)
        run: uv run ruff check memplex tests
      - name: Architecture contract (domain never imports adapters)
        run: uv run lint-imports
      - name: Type-check PostgreSQL lifecycle boundary
        run: uv run mypy
      - name: Acquire fixed source-validity compatibility reader
        run: |
          git fetch --no-tags --depth=1 origin 826335024c0b67b1b25fdb477596bf08ddeb7dad
          test "$(git rev-parse 826335024c0b67b1b25fdb477596bf08ddeb7dad^{tree})" = "7fd32f681a1a2cc9044823b672aaacfa96e63ef6"
      - name: Test
        env:
          # The install-matrix test discovers interpreters; on Linux images
          # only the job's setup-python interpreter exists, so pin the matrix
          # to it. (macOS images preinstall all versions; the dedicated
          # release-install-matrix job passes its own full matrix.)
          MEMPLEX_INSTALL_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run pytest \
            tests/test_g004_cli_runner_contract.py \
            tests/test_g004_lite_real_value.py \
            tests/test_g004_agent_real_value.py \
            tests/test_g004_sync_real_loopback.py \
            -q
          uv run pytest tests \
            --ignore=tests/test_g004_postgres_backup_real_value.py \
            --ignore=tests/test_g004_postgres_probe_isolation.py \
            -v --timeout=120 --cov=memplex --cov-report=term-missing \
            --cov-fail-under=75 \
            --junitxml=source-v1-junit.xml -o junit_family=legacy \
            -o junit_logging=no -o junit_log_passing_tests=false
      - name: Preserve source-validity case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-v1-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: source-v1-junit.xml
          retention-days: 7

