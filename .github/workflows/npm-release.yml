name: NPM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path.cwd()
          py_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          npm_version = json.loads((root / "npm/memplex/package.json").read_text())["version"]
          if py_version != npm_version:
              raise SystemExit(f"version mismatch: pyproject={py_version} npm={npm_version}")
          print(f"version ok: {py_version}")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package contents
        working-directory: npm/memplex
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: npm/memplex
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Missing NPM_TOKEN repository secret."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if npm view "memplex@${package_version}" version >/dev/null 2>&1; then
            echo "memplex@${package_version} already exists on npm; skipping publish."
            exit 0
          fi

          npm publish --access public
