name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check memplex tests

    - name: Run tests with coverage
      # Coverage gate tracks the measured baseline (70% after the cli/
      # dedup/vector/handlers/extractors/embedding/feedback/enhancer/wiki
      # coverage push). Floor sits below baseline to catch regressions
      # without blocking incremental work on the remaining modules.
      run: |
        python -m pytest tests/ -v \
          --cov=memplex \
          --cov-report=term-missing \
          --cov-fail-under=68

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Audit dependencies for known vulnerabilities
      run: pip-audit --strict

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build package
      run: |
        pip install build
        python -m build

    - name: Check package
      run: pip install dist/*.whl --dry-run
