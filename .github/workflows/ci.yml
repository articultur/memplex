# Workflow re-evaluation: fix hash-seed determinism
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install test environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Lint (incl. C901 complexity freeze-gate)
        run: uv run ruff check memplex tests
      - name: Architecture contract (domain never imports adapters)
        run: uv run lint-imports
      - name: Type-check PostgreSQL lifecycle boundary
        run: uv run mypy
      - name: Test
        env:
          # The install-matrix test discovers interpreters; on Linux images
          # only the job's setup-python interpreter exists, so pin the matrix
          # to it. (macOS images preinstall all versions; the dedicated
          # release-install-matrix job passes its own full matrix.)
          MEMPLEX_INSTALL_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest tests -v --cov=memplex --cov-report=term-missing --cov-fail-under=68

  test-postgres:
    # Exercises the flagship PostgreSQL backend against the pgvector service
    # used in production-shaped CI.  The test fixture still creates a fresh
    # schema per test, so service reuse cannot leak catalogue state.
    runs-on: ubuntu-latest
    env:
      MEMPLEX_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/memplex
      MEMPLEX_REQUIRE_PGVECTOR: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: memplex
          POSTGRES_USER: postgres
          # The integration suite creates ad-hoc LOGIN roles without
          # passwords and connects as them (the local pgserver runner uses
          # unix-socket trust). trust on the loopback-only, disposable CI
          # container matches that contract; scram would reject every
          # dynamically created role.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memplex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install PostgreSQL test environment
        run: |
          uv lock --check
          uv sync --locked --extra dev --extra pgtest
      - name: Run real-PostgreSQL integration suite
        run: |
          uv run pytest \
            tests/test_ci_postgres_contract.py \
            tests/test_postgres_integration.py \
            tests/test_postgres_backup_integration.py \
            tests/test_sync_postgres_integration.py \
            tests/test_sync_repository_contract.py \
            tests/test_postgres_store.py \
            tests/test_g014_postgres_task_repository.py \
            -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12 mirrors test-postgres: the audited lock includes the
          # ``pgtest`` extra, and ``pgserver`` publishes no cp313 wheel —
          # pip-audit's py3.13 venv cannot resolve it.
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Audit the exact lock
        run: |
          uv lock --check
          uv export --locked \
            --extra all \
            --extra embedding \
            --extra extractors \
            --extra vector \
            --extra local-onnx \
            --extra graph \
            --extra http \
            --extra llm \
            --extra postgres \
            --extra pgtest \
            --extra dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/memplex-requirements.txt
          # PYSEC-2026-311 affects chromadb (optional ``vector`` extra);
          # no fixed release exists upstream — tracked, ignored with cause.
          uvx --from pip-audit==2.9.0 pip-audit --strict \
            --ignore-vuln PYSEC-2026-311 \
            --requirement /tmp/memplex-requirements.txt

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Build python distribution
        run: uv build --out-dir "$RUNNER_TEMP/python-dist" .
      - name: Smoke the npm package
        working-directory: npm/memplex
        run: npm pack --dry-run --json --ignore-scripts

  release-install-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        node-version: ['22.14.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Install locked test environment
        run: uv sync --locked --extra dev
      - name: Verify release artifact install lifecycle
        env:
          MEMPLEX_INSTALL_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest -q tests/test_release_install_matrix.py
