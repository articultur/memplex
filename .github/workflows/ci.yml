# Workflow re-evaluation: fix hash-seed determinism
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    # Requires the repository "Dependency graph" setting (Settings →
    # Security analysis), an owner-controlled toggle without a public
    # API; non-blocking until it is switched on.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install test environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Lint (incl. C901 complexity freeze-gate)
        run: uv run ruff check memplex tests
      - name: Architecture contract (domain never imports adapters)
        run: uv run lint-imports
      - name: Type-check PostgreSQL lifecycle boundary
        run: uv run mypy
      - name: Test
        env:
          # The install-matrix test discovers interpreters; on Linux images
          # only the job's setup-python interpreter exists, so pin the matrix
          # to it. (macOS images preinstall all versions; the dedicated
          # release-install-matrix job passes its own full matrix.)
          MEMPLEX_INSTALL_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run pytest \
            tests/test_g004_cli_runner_contract.py \
            tests/test_g004_lite_real_value.py \
            tests/test_g004_agent_real_value.py \
            tests/test_g004_sync_real_loopback.py \
            -q
          uv run pytest tests \
            --ignore=tests/test_g004_postgres_backup_real_value.py \
            --ignore=tests/test_g004_postgres_probe_isolation.py \
            -v --timeout=120 --cov=memplex --cov-report=term-missing \
            --cov-fail-under=75

  test-postgres:
    # Exercises the flagship PostgreSQL backend against the pgvector service
    # used in production-shaped CI.  The test fixture still creates a fresh
    # schema per test, so service reuse cannot leak catalogue state.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEMPLEX_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/memplex
      MEMPLEX_REQUIRE_PGVECTOR: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: memplex
          POSTGRES_USER: postgres
          # The integration suite creates ad-hoc LOGIN roles without
          # passwords and connects as them (the local pgserver runner uses
          # unix-socket trust). trust on the loopback-only, disposable CI
          # container matches that contract; scram would reject every
          # dynamically created role.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memplex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install PostgreSQL test environment
        run: |
          uv lock --check
          uv sync --locked --extra dev --extra pgtest
      - name: Pin pg client tools to the service container's major
        # The backup executor enforces client/server major-version parity
        # (postgres_client_server_major_mismatch); the runner image's
        # default client can drift ahead of the pinned pg16 container.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version
      - name: Run real-PostgreSQL integration suite
        run: |
          uv run pytest \
            tests/test_ci_postgres_contract.py \
            tests/test_postgres_integration.py \
            tests/test_postgres_backup_integration.py \
            tests/test_sync_postgres_integration.py \
            tests/test_sync_repository_contract.py \
            tests/test_postgres_store.py \
            tests/test_g014_postgres_task_repository.py \
            tests/test_g004_postgres_backup_real_value.py \
            tests/test_g004_postgres_probe_isolation.py \
            -v --timeout=120

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12 mirrors test-postgres: the audited lock includes the
          # ``pgtest`` extra, and ``pgserver`` publishes no cp313 wheel —
          # pip-audit's py3.13 venv cannot resolve it.
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Audit the exact lock
        run: |
          uv lock --check
          uv export --locked \
            --extra all \
            --extra embedding \
            --extra extractors \
            --extra vector \
            --extra local-onnx \
            --extra graph \
            --extra http \
            --extra llm \
            --extra postgres \
            --extra pgtest \
            --extra dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/memplex-requirements.txt
          # PYSEC-2026-311 and the three 2026-09 GHSAs affect chromadb
          # (optional ``vector`` extra); 1.5.9 is the latest upstream release
          # and no fixed version exists — tracked, ignored with cause.
          uvx --from pip-audit==2.9.0 pip-audit --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln GHSA-2wm9-hf6c-p5cr \
            --ignore-vuln GHSA-36p7-vc44-83pf \
            --ignore-vuln GHSA-xph7-9rjv-w5fr \
            --requirement /tmp/memplex-requirements.txt

  bench-smoke:
    # Fast deterministic retrieval regression gate (~1 min): seeds 50
    # synthetic facts into a throwaway lite store and asserts recall@10
    # clears a floor set far below the measured value.  Complements, never
    # replaces, the full benchmark methodology in docs/benchmarks.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install benchmark environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Run deterministic retrieval smoke gate
        run: uv run python scripts/ci_bench_smoke.py

  prometheus-config:
    # promtool ships in the prometheus release tarball — lighter than
    # pulling the prom/prometheus image; the download is verified against
    # the release's signed-by-project checksum file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Install promtool
        run: |
          version=2.53.4
          base="https://github.com/prometheus/prometheus/releases/download/v${version}"
          tarball="prometheus-${version}.linux-amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/sha256sums.txt" | grep " ${tarball}\$" | sha256sum --check
          tar -xzf "$tarball" --strip-components=1 --wildcards '*/promtool'
          ./promtool --version
      - name: Check alert rules and the scrape config example
        run: |
          ./promtool check rules deploy/prometheus/memplex-alerts.yml
          ./promtool check config deploy/prometheus/prometheus.yml
      # The prometheus tarball ships promtool only; amtool would need the
      # alertmanager tarball.  The alertmanager example is a static routing
      # tree, so a YAML syntax check is the cost-appropriate gate here.
      - name: Syntax-check the alertmanager example
        run: |
          uv run --with pyyaml python -c \
            "import pathlib, yaml; yaml.safe_load(pathlib.Path('deploy/prometheus/alertmanager.yml').read_text())"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Build python distribution
        run: uv build --out-dir "$RUNNER_TEMP/python-dist" .
      - name: Smoke the npm package
        working-directory: npm/memplex
        run: npm pack --dry-run --json --ignore-scripts

  release-install-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        node-version: ['22.14.0', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Install locked test environment
        run: uv sync --locked --extra dev
      - name: Verify release artifact install lifecycle
        env:
          MEMPLEX_INSTALL_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest -q tests/test_release_install_matrix.py
