name: Mutation Nightly

# Daily cosmic-ray pilot on the frozen sync_ingress validator.  Runtime is
# ~15 min, so this runs on a schedule instead of per-PR; the outcome counts
# are compared against the baseline recorded in pyproject.toml [cosmic-ray]
# (77 killed / 33 survived / 1 incompetent) with a small slack for noise.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install mutation environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Run the cosmic-ray pilot
        # uv run puts .venv/bin (cosmic-ray, cr-report, pytest) on PATH.
        run: MUTATION_PILOT_REPORT="$RUNNER_TEMP/cr-report.txt" uv run scripts/mutation_pilot.sh
      - name: Compare against the 77 killed / 33 survived baseline
        run: |
          python - "$RUNNER_TEMP/cr-report.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          report = Path(sys.argv[1]).read_text(encoding="utf-8")
          # Robust to the enum repr form (TestOutcome.KILLED / killed /
          # KILLED) across cosmic-ray versions; a silent zero here once
          # reported "0 killed / 0 survived" while jobs existed.
          outcome = re.compile(
              r"test outcome:\s*(?:TestOutcome\.)?(killed|survived|incompetent)",
              re.IGNORECASE,
          )
          counts = {"killed": 0, "survived": 0, "incompetent": 0}
          for m in outcome.finditer(report):
              counts[m.group(1).lower()] += 1
          killed, survived, incompetent = (
              counts["killed"], counts["survived"], counts["incompetent"],
          )
          # Cross-check against the report's own summary lines: a parser
          # that finds zero while the summary says jobs completed is a
          # parse failure, not a mutation result.
          total_match = re.search(r"^total jobs:\s*(\d+)", report, re.MULTILINE)
          surviving_match = re.search(r"^surviving mutants:\s*(\d+)", report, re.MULTILINE)
          total_jobs = int(total_match.group(1)) if total_match else 0
          if total_jobs > 0 and killed + survived + incompetent == 0:
              raise SystemExit(
                  f"mutation parser found 0 outcomes in a report with "
                  f"{total_jobs} jobs - report format changed again; "
                  "fix the regex in mutation-nightly.yml"
              )
          if surviving_match:
              summary_survived = total_jobs - int(surviving_match.group(1)) - (
                  killed + survived + incompetent - total_jobs
              )
              if int(surviving_match.group(1)) != survived:
                  print(
                      f"warning: summary surviving={surviving_match.group(1)} "
                      f"!= parsed survived={survived}"
                  )
          print(f"mutation pilot: {killed} killed / {survived} survived / {incompetent} incompetent (total jobs: {total_jobs})")
          BASELINE_KILLED = 77
          BASELINE_SURVIVED = 33
          SLACK = 5
          if killed < BASELINE_KILLED - SLACK or survived > BASELINE_SURVIVED + SLACK:
              raise SystemExit(
                  f"mutation pilot drifted from the baseline "
                  f"({killed} killed / {survived} survived vs {BASELINE_KILLED}/{BASELINE_SURVIVED}); "
                  "if the change to memplex/sync_ingress.py is intentional, update the baseline "
                  "in pyproject.toml [cosmic-ray] and this workflow"
              )
          PY
