name: Mutation Nightly

# Daily cosmic-ray pilot on the frozen sync_ingress validator.  Runtime is
# ~15 min, so this runs on a schedule instead of per-PR; the outcome counts
# are compared against the baseline recorded in pyproject.toml [cosmic-ray]
# (77 killed / 33 survived / 1 incompetent) with a small slack for noise.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Verify lock and install mutation environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
      - name: Run the cosmic-ray pilot
        # uv run puts .venv/bin (cosmic-ray, cr-report, pytest) on PATH.
        run: MUTATION_PILOT_REPORT="$RUNNER_TEMP/cr-report.txt" uv run scripts/mutation_pilot.sh
      - name: Compare against the 77 killed / 33 survived baseline
        run: |
          python - "$RUNNER_TEMP/cr-report.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          report = Path(sys.argv[1]).read_text(encoding="utf-8")
          killed = len(re.findall(r"test outcome: killed", report))
          survived = len(re.findall(r"test outcome: survived", report))
          incompetent = len(re.findall(r"test outcome: incompetent", report))
          print(f"mutation pilot: {killed} killed / {survived} survived / {incompetent} incompetent")
          BASELINE_KILLED = 77
          BASELINE_SURVIVED = 33
          SLACK = 5
          if killed < BASELINE_KILLED - SLACK or survived > BASELINE_SURVIVED + SLACK:
              raise SystemExit(
                  f"mutation pilot drifted from the baseline "
                  f"({killed} killed / {survived} survived vs {BASELINE_KILLED}/{BASELINE_SURVIVED}); "
                  "if the change to memplex/sync_ingress.py is intentional, update the baseline "
                  "in pyproject.toml [cosmic-ray] and this workflow"
              )
          PY
