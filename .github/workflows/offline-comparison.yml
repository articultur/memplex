name: offline-comparison
on:
  pull_request:
    paths: ["benchmarks/offline_comparison/**", "tests/test_offline_comparison.py", ".github/workflows/offline-comparison.yml"]
  push:
    paths: ["benchmarks/offline_comparison/**", "tests/test_offline_comparison.py", ".github/workflows/offline-comparison.yml"]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Label boundary, fixed split, scoring and error accounting
        run: python -m unittest tests.test_offline_comparison -v
      # The 277 MB public corpus is deliberately not downloaded in PR CI.
      # Existing full repository CI still runs its normal product checks.
