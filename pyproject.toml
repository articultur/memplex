[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memplex"
version = "3.2.7"
description = "Memplex - Memory Complex: multi-agent knowledge graph memory system with 3-layer retrieval"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=2.0",
]
extractors = [
    "pdfplumber>=0.9.0",
    "python-docx>=0.8.11",
    "Pillow>=9.0",
    "pytesseract>=0.3.10",
]
vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0",
]
local-onnx = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
]
graph = [
    "networkx>=3.0",
    "python-louvain>=0.16",
]
http = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
llm = [
    "anthropic>=0.30.0",
    "openai>=1.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
]
neo4j = [
    "neo4j>=5.0.0",
]
all = [
    "memplex[embedding,extractors,vector,local-onnx,graph,http,llm]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
memplex = "memplex:main"

[tool.setuptools.packages.find]
include = ["memplex*"]

[tool.setuptools.package-data]
"memplex._plugin" = ["**/*", "**/.*", ".claude-plugin/*"]

[tool.setuptools.exclude-package-data]
"memplex._plugin" = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Re-export pattern: __init__.py imports for public API re-export
"memplex/models/__init__.py" = ["F401"]
# Availability-check imports: try/except import pattern
"memplex/core/extractors/docx.py" = ["F401"]
"memplex/core/extractors/image.py" = ["F401"]
"memplex/core/extractors/pdf.py" = ["F401"]
# Factory registration at module bottom
"memplex/benchmarks/locomo.py" = ["E402"]
# Unused optional import
"memplex/storage/__init__.py" = ["F401"]
# prometheus_client.metrics import (historical artifact)
"memplex/metrics.py" = ["F401"]
# Benchmark stub variables assigned for future use
"memplex/benchmarks/nq_trivia.py" = ["F841"]
"memplex/benchmarks/popqa_hotpot.py" = ["F841"]
# Intentionally assigned variable
"memplex/service.py" = ["F841"]
"tests/test_hooks.py" = ["E741"]

[tool.ruff.lint]
ignore = [
    # Re-export pattern: imports used by downstream modules
    "F401",
    # Availability-check imports in optional dependency extractors
    "F401",
    # Factory registration at end of module files
    "E402",
    # Intentionally assigned-but-unused variables in benchmark stubs
    "F841",
]
